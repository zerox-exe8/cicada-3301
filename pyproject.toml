[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kyro"
version = "2.4.0"
description = "Kyro Discord Bot - High-Performance Multi-Purpose Discord Bot"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Kyro Systems Team" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "bandit>=1.7.8",
    "pip-audit>=2.7.2",
    "pre-commit>=3.6.2",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::ResourceWarning",
]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    ".git",
    ".agents",
    "__pycache__",
    "build",
    "dist",
    ".venv",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "C90",  # mccabe complexity
]
ignore = [
    "E501", # line length handled by black/formatter
    "E402", # module level import not at top of file
    "F401", # unused import (sometimes needed for re-exports)
]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
# High-complexity command routers and event listeners preserved without refactor per Rule 4
"src/cogs/antinuke/_helpers.py" = ["C901"]
"src/cogs/antinuke/antibot.py" = ["C901"]
"src/cogs/antinuke/chat_defense.py" = ["C901"]
"src/cogs/developer/reload.py" = ["C901"]
"src/cogs/general/help.py" = ["C901"]
"src/cogs/general/profile.py" = ["C901"]
"src/cogs/general/userinfo.py" = ["C901"]
"src/cogs/meeting/meeting.py" = ["C901"]
"src/cogs/moderation/purge.py" = ["C901"]
"src/cogs/music/_agent.py" = ["C901"]
"src/cogs/music/_autoplay.py" = ["C901"]
"src/cogs/music/_commands/play.py" = ["C901"]
"src/cogs/music/_commands/playlist.py" = ["C901"]
"src/cogs/music/_extractor.py" = ["C901"]
"src/cogs/music/_player.py" = ["C901"]
"src/cogs/music/_playlist_views.py" = ["C901"]
"src/cogs/music/music.py" = ["C901"]
"src/cogs/ticket/ticket_system.py" = ["C901"]
"src/cogs/utility/afk.py" = ["C901"]
"src/cogs/utility/dev_pulse.py" = ["C901"]
"src/cogs/utility/embed_builder.py" = ["C901"]
"src/cogs/utility/events.py" = ["C901"]
"src/cogs/utility/snipe.py" = ["C901"]
"src/cogs/utility/snipe_all.py" = ["C901"]
"src/cogs/utility/steal.py" = ["C901"]
"src/cogs/utility/tech_feed.py" = ["C901"]
"src/core/lavalink.py" = ["C901"]
"src/errors/handler.py" = ["C901"]
"src/managers/dev_pulse_manager.py" = ["C901"]
"src/managers/security_agent.py" = ["C901"]
"src/managers/tech_manager.py" = ["C901"]
"src/managers/translator_manager.py" = ["C901"]
"src/utils/containers.py" = ["C901"]
"src/utils/emojis.py" = ["C901"]

[tool.bandit]
exclude_dirs = ["tests", ".agents", ".venv", "__pycache__"]
skips = [
    "B101",  # skip assert warnings in tests
    "B311",  # pseudo-random in non-cryptographic contexts (shuffling, giveaway picker, jitter)
    "B102",  # exec used in dedicated ?eval developer command
    "B104",  # bind to all interfaces (audio server / lavalink socket)
    "B112",  # try/except continue in retry loops
    "B314",  # xml.etree.ElementTree in news feed harvesters
    "B405",  # xml.etree import in news feed harvesters
    "B608",  # false-positive on discord UI text containing 'select ... from' and whitelisted column maps
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["tests/", ".agents/"]
