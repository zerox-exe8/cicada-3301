[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kyro-engine"
version = "1.0.0"
description = "Enterprise C100K Distributed Engine & Unblockable Audio Node for Kyro Ecosystem"
readme = "SYSTEM_DESIGN.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "asyncpg>=0.29.0",
    "redis>=5.0.4",
    "aiohttp>=3.9.5",
    "pyDes>=2.0.1",
    "yt-dlp>=2024.8.6",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
