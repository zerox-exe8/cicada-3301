services:
  - type: web
    name: kyro-engine
    runtime: docker
    dockerfilePath: Dockerfile
    plan: starter
    region: oregon
    envVars:
      - key: PORT
        value: 10000
      - key: ENV
        value: production
      - key: DEBUG
        value: false
      - key: WORKER_ID
        value: render-worker-01
      - key: YOUTUBE_CLIENTS
        value: android_music,android,ios
      - key: AUDIO_PREBUFFER_SECONDS
        value: 5
    healthCheckPath: /health
